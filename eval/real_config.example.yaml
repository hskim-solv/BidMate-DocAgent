real_eval:
  data_list: "${REAL_EVAL_DATA_LIST:-data/data_list.csv}"
  document_dirs:
    default: "${REAL_EVAL_DATA_DIR:-data/files}"
    hwp_pdf_artifacts: "${REAL_EVAL_HWP_PDF_ARTIFACT_DIR:-data/index/real100/hwp_pdf_artifacts}"
  cache:
    root: "${REAL_EVAL_CACHE_DIR:-.cache/real_eval}"
    rebuild: false
  index:
    root: "${REAL_EVAL_INDEX_DIR:-data/index/real100}"
    min_private_chunks: 1001
  index_build:
    hwp_loader: pdf_pymupdf4llm
    pdf_loader: pdf_pymupdf4llm
  reports:
    output_dir: "${REAL_EVAL_REPORT_DIR:-reports/real100}"
    baseline_summary: "${REAL_EVAL_BASELINE_SUMMARY:-reports/real100/baseline.aggregate.json}"

mode: rag
description: Local-only real RFP evaluation template. Copy to eval/real_config.local.yaml and fill with private expected values.
index_dir: data/index/real100
index_build:
  hwp_loader: pdf_pymupdf4llm
  pdf_loader: pdf_pymupdf4llm
  hwp_pdf_artifact_dir: data/index/real100/hwp_pdf_artifacts
answer_policy:
  answerable_status: supported
  unanswerable_status: insufficient
  min_claims_answerable: 1
  require_claim_citations: true
ablation_runs:
  - name: full
    metadata_first: true
    rerank: true
    verifier_retry: true
    retrieval_mode: flat
  # ADR 0056 answer_reasoning axis (rationality judge) 를 측정하려면 synthesis 가
  # 도는 run 이 필요하다. eval_summary 의 case_results 는 primary run 것만 담으므로
  # (eval/run_eval.py), 아래 full_llm arm 을 활성화하고 `primary_run: full_llm` 로
  # 설정한 뒤 `BIDMATE_TRACE_FULL=1 BIDMATE_SYNTHESIS_BACKEND=stub` 로 real-eval 을
  # 돌린다 (또는 run_rationality_judge.py 를 `--traces-dir <out>/traces/full_llm`
  # 로 override). extractive `full` primary 로는 answer_reasoning effective_n=0.
  # - name: full_llm
  #   pipeline: agentic_full_llm
  #   metadata_first: true
  #   rerank: true
  #   verifier_retry: true
  #   retrieval_mode: flat
cases:
  - id: replace_single_doc_budget_schedule
    query_type: single_doc
    query: "발주기관명 사업명의 사업기간과 사업예산 알려줘"
    expected_doc_ids:
      - replace-with-real-doc-id
    expected_terms:
      - "replace-with-budget-term"
      - "replace-with-schedule-term"
    expected_citation_terms:
      - "replace-with-budget-term"
    expected_claim_targets:
      - "replace-with-agency"
    answerable: true
    # Optional: ADR 0039 hardcase taxonomy tags (multi-label list).
    # Allowed values: table_heavy / ocr_noisy / rotated_or_skewed / layout_broken.
    # Unknown values are dropped by scripts/run_real_eval_delta.py before any
    # aggregate crosses the ADR 0005 commit boundary, so the private 5-slice
    # taxonomy (scanned_pdf / mixed_layout / noisy_ocr) stays local-only.
    # hardcase_categories:
    #   - table_heavy

  - id: replace_absent_fact
    query_type: abstention
    query: "발주기관명 사업명의 문서에 없는 조건을 알려줘"
    expected_doc_ids: []
    expected_terms: []
    expected_citation_terms: []
    expected_claim_targets: []
    answerable: false
