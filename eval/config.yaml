mode: rag
description: >
  Public fixture smoke evaluation for deterministic CI reproducibility.
  This config is not a public benchmark; private/internal eval sets carry
  real performance claims.
index_dir: data/index
primary_run: naive_baseline

answer_policy:
  answerable_status: supported
  unanswerable_status: insufficient
  min_claims_answerable: 1
  require_claim_citations: true

latency_budgets:
  naive_baseline: {p95_ms: 1200}
  full: {p95_ms: 2500}
  full_dense: {p95_ms: 2500}
  full_llm: {p95_ms: 3000}
  full_llm_metadata: {p95_ms: 2500}
  no_metadata_first: {p95_ms: 2500}
  no_rerank: {p95_ms: 2500}
  no_verifier_retry: {p95_ms: 2500}
  retrieval_only: {p95_ms: 2500}
  full_bm25s: {p95_ms: 2500}
  single_chunk: {p95_ms: 1200}
  random_retrieval: {p95_ms: 1200}
  agent_react: {p95_ms: 3500}
  agentic_full_finetuned: {p95_ms: 2500}
  naive_baseline_finetuned: {p95_ms: 1200}

stage_latency_budgets:
  naive_baseline:
    query_analysis_ms: {p95_ms: 250}
    context_resolution_ms: {p95_ms: 250}
    answer_generation_ms: {p95_ms: 250}
    retrieve_ms: {p95_ms: 700}
    verify_ms: {p95_ms: 700}
  full:
    query_analysis_ms: {p95_ms: 350}
    context_resolution_ms: {p95_ms: 350}
    answer_generation_ms: {p95_ms: 350}
    retrieve_ms: {p95_ms: 1200}
    verify_ms: {p95_ms: 1200}
  agent_react:
    query_analysis_ms: {p95_ms: 500}
    context_resolution_ms: {p95_ms: 500}
    answer_generation_ms: {p95_ms: 500}
    retrieve_ms: {p95_ms: 1500}
    verify_ms: {p95_ms: 1500}
    react_loop_ms: {p95_ms: 2000}

ablation_runs:
  - name: naive_baseline
    pipeline: naive_baseline
    metadata_first: false
    rerank: false
    verifier_retry: false
    retrieval_mode: flat
    retrieval_backend: dense
    query_expansion: identity
  - name: full
    pipeline: agentic_full
    metadata_first: true
    rerank: true
    verifier_retry: true
    retrieval_mode: flat
    retrieval_backend: hybrid
    query_expansion: identity
    metadata_backend: regex
  - name: full_dense
    pipeline: agentic_full
    metadata_first: true
    rerank: true
    verifier_retry: true
    retrieval_mode: flat
    query_expansion: identity
    metadata_backend: regex
    retrieval_backend: dense
  - name: full_llm
    pipeline: agentic_full_llm
    metadata_first: true
    rerank: true
    verifier_retry: true
    retrieval_mode: flat
    retrieval_backend: hybrid
    query_expansion: identity
  - name: full_llm_metadata
    pipeline: agentic_full
    metadata_first: true
    rerank: true
    verifier_retry: true
    retrieval_mode: flat
    retrieval_backend: hybrid
    query_expansion: identity
    metadata_backend: anthropic_tool_use
  - name: no_metadata_first
    pipeline: agentic_full
    metadata_first: false
    rerank: true
    verifier_retry: true
    retrieval_mode: flat
    retrieval_backend: hybrid
    query_expansion: identity
  - name: no_rerank
    pipeline: agentic_full
    metadata_first: true
    rerank: false
    verifier_retry: true
    retrieval_mode: flat
    retrieval_backend: hybrid
    query_expansion: identity
  - name: no_verifier_retry
    pipeline: agentic_full
    metadata_first: true
    rerank: true
    verifier_retry: false
    retrieval_mode: flat
    retrieval_backend: hybrid
    query_expansion: identity
  - name: retrieval_only
    pipeline: agentic_full
    metadata_first: true
    rerank: false
    verifier_retry: false
    retrieval_mode: flat
    retrieval_backend: hybrid
    query_expansion: identity
  - name: full_bm25s
    pipeline: agentic_full
    metadata_first: true
    rerank: true
    verifier_retry: true
    retrieval_mode: flat
    retrieval_backend: hybrid
    query_expansion: identity
    bm25_backend: bm25s
  - name: single_chunk
    pipeline: single_chunk
    metadata_first: false
    rerank: false
    verifier_retry: false
    retrieval_mode: flat
    retrieval_backend: dense
    query_expansion: identity
  - name: random_retrieval
    pipeline: agentic_full
    metadata_first: false
    rerank: false
    verifier_retry: false
    retrieval_mode: flat
    retrieval_backend: random
    query_expansion: identity
  - name: agent_react
    pipeline: agent_react
    metadata_first: true
    rerank: true
    verifier_retry: true
    retrieval_mode: flat
    retrieval_backend: hybrid
    query_expansion: identity
    planner_backend: static
  - name: agentic_full_finetuned
    pipeline: agentic_full
    metadata_first: true
    rerank: true
    verifier_retry: true
    retrieval_mode: flat
    retrieval_backend: hybrid
    query_expansion: identity
    metadata_backend: regex
    embedding_model: nlpai-lab/KURE-v1
    embedding_lora_adapter: bidmate/embedding-lora-kure-rfp-ko-v1@<sha>
  - name: naive_baseline_finetuned
    pipeline: naive_baseline
    metadata_first: false
    rerank: false
    verifier_retry: false
    retrieval_mode: flat
    retrieval_backend: dense
    query_expansion: identity
    embedding_model: nlpai-lab/KURE-v1
    embedding_lora_adapter: bidmate/embedding-lora-kure-rfp-ko-v1@<sha>

cases:
  - id: smoke_single_doc_security
    query_type: single_doc
    query: "기관 A의 보안 통제 요구사항은?"
    expected_doc_ids: ["rfp-agency-a-ai-quality"]
    expected_terms: ["보안 통제", "로그 추적"]
    expected_citation_terms: ["보안 통제"]
    answerable: true
    hardcase_categories: ["public_fixture_smoke"]

  - id: smoke_comparison_ai_requirements
    query_type: comparison
    query: "기관 A와 기관 B의 AI 요구사항 차이 알려줘"
    expected_doc_ids:
      - rfp-agency-a-ai-quality
      - rfp-agency-b-mlops-governance
    expected_terms: ["품질관리", "MLOps", "데이터 거버넌스"]
    expected_citation_terms: ["품질관리", "MLOps"]
    expected_claim_citations:
      - target: "기관 A"
        expected_doc_ids: ["rfp-agency-a-ai-quality"]
        expected_terms: ["품질관리"]
      - target: "기관 B"
        expected_doc_ids: ["rfp-agency-b-mlops-governance"]
        expected_terms: ["MLOps"]
    answerable: true
    hardcase_categories: ["public_fixture_smoke"]

  - id: smoke_spectrometer_calibration
    query_type: single_doc
    query: "기관 D 분광기 라만 캘리브레이션 주기는?"
    expected_doc_ids: ["rfp-agency-d-spectrometer-probe"]
    expected_terms: ["매일"]
    expected_citation_terms: ["매일"]
    answerable: true
    hardcase_categories: ["public_fixture_smoke", "chunk_boundary"]

  - id: smoke_spectrometer_audit
    query_type: single_doc
    query: "기관 D 분광기 운영 데이터의 외부 감사 주기는?"
    expected_doc_ids: ["rfp-agency-d-spectrometer-probe"]
    expected_terms: ["분기별"]
    expected_citation_terms: ["분기별"]
    answerable: true
    hardcase_categories: ["public_fixture_smoke", "chunk_boundary"]

  - id: smoke_abstention_missing_blockchain
    query_type: abstention
    query: "기관 A의 블록체인 납품 실적은?"
    expected_doc_ids: []
    expected_terms: ["블록체인"]
    answerable: false
    hardcase_categories: ["public_fixture_smoke", "abstention"]
