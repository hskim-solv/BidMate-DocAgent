name: Branch & Issue Convention

# Enforces the ADR 0007 governance gate per PR:
#   - branch named `<type>/issue-<N>[-<slug>]` with a matching
#     `Closes #N` in the body, and the referenced issue must exist
#     in this repo.
#
# (The §5b real-data-delta hard-gate was deprecated in ADR 0084 — the
# real-eval-delta tool is retained, but PR-body §5b is no longer required.)
#
# Fast (~15s, no checkout). Should be set as a required status
# check on `main` after one green run.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    # No `branches:` filter — these PR-correctness gates must fire on EVERY PR
    # base, not just main. A `branches: [main]` filter would exempt stacked PRs
    # (base≠main) from the branch/issue and ceiling-ratchet gates (issue #1159).
    # Guarded by tests/test_pr_gate_workflow_triggers_regression.py.

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  branch-and-issue:
    name: Validate branch name + issue link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/check_branch_and_issue.py
            scripts/_governance.py
            scripts/check_embedding_routed_spread.py
            reports/embedding_routed.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate branch name + issue link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/check_branch_and_issue.py --pr ${{ github.event.pull_request.number }}

      - name: Enforce failure-rate ceiling ratchet (ADR 0062)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Fail when a PR raises/removes a ceiling in
          # tests/test_failure_rate_regression.py without an explicit
          # [ALLOW_REGRESSION: <category> ...] token in the body. Fetches the
          # base + head versions of the test file via the contents API, so no
          # extra checkout is needed. Skips when the file isn't in the diff.
          python scripts/check_branch_and_issue.py --check-ceiling-ratchet ${{ github.event.pull_request.number }}

      - name: Guard ADR file deletion/rename (CLAUDE.md Prohibited)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Backup CI gate for the pre-commit ADR guard (issue #619).
          # Catches --no-verify bypasses. Uses PR file list from GitHub API
          # so no git history fetch is needed.
          adr_violations=$(gh api \
            "/repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '[.[] | select(.filename | test("^docs/adr/.+\\.md$")) | select(.status == "removed" or .status == "renamed")] | length')
          if [[ "$adr_violations" -gt 0 ]]; then
            echo "❌ ADR files may not be deleted/renamed (CLAUDE.md Prohibited)." >&2
            echo "   Mark Superseded in the Status block and keep the file." >&2
            gh api \
              "/repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
              --jq '.[] | select(.filename | test("^docs/adr/.+\\.md$")) | select(.status == "removed" or .status == "renamed") | "  " + .status + ": " + .filename' >&2
            exit 1
          fi
          echo "✅ No ADR file deletions/renames in this PR."

      - name: ADR 0032 embedding spread gate (issue #626)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # When an embedding-related path changes in this PR, verify that
          # reports/embedding_routed.json was also updated AND spread < threshold.
          # Non-embedding PRs: skip entirely.
          #
          # rag_embeddings.py and eval/routed_config.yaml fire unconditionally
          # (they are purely embedding-domain files). eval/config.yaml is shared
          # across many concerns (ablation rows, judges, retrieval knobs, etc.),
          # so we fire only when its diff *patch* contains an embedding-routing
          # keyword.  Keyword set (issue #810):
          #
          #     embedding | embed_backend | embed_model | model_key | hf_id
          #     | sentence_transformer | routed
          #
          # Bypassed example: flipping `retrieval_only.rerank: true → false`
          # (PR #802) — no keyword in the patch, gate correctly skipped.
          unconditional_changes=$(gh api \
            "/repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '[.[] | select(.filename | test("^(rag_embeddings\\.py|eval/routed_config\\.yaml)$"))] | length')
          config_keyword_hits=$(gh api \
            "/repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | select(.filename == "eval/config.yaml") | .patch // ""' \
            | grep -cE '^[+-].*\b(embedding|embed_backend|embed_model|model_key|hf_id|sentence_transformer|routed)\b' \
            || true)
          embedding_changes=$((unconditional_changes + config_keyword_hits))
          if [[ "$embedding_changes" -eq 0 ]]; then
            echo "✅ No embedding-related path changes — spread gate skipped."
            exit 0
          fi
          echo "ℹ️  Embedding-related paths changed (unconditional=$unconditional_changes config_keyword_hits=$config_keyword_hits); checking reports/embedding_routed.json spread."
          routed_changed=$(gh api \
            "/repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '[.[] | select(.filename == "reports/embedding_routed.json")] | length')
          if [[ "$routed_changed" -eq 0 ]]; then
            echo "❌ Embedding path changed but reports/embedding_routed.json was NOT updated." >&2
            echo "   Run: python scripts/run_routed_measurement.py --backend sentence-transformers" >&2
            echo "   Then commit the updated reports/embedding_routed.json." >&2
            exit 1
          fi
          python scripts/check_embedding_routed_spread.py --report reports/embedding_routed.json
