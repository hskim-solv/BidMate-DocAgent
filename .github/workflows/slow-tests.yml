name: Slow / real-model tests

# Issue #1281 — the `slow`-marked suite (#1215) runs OFF the per-PR critical
# path. These are the full-corpus + real-model (FlagEmbedding / BGE-M3) tests;
# the BGE-M3 end-to-end test alone is ~12min of CPU inference (NOT download —
# an HF model cache made no measurable difference, see #1281), an irreducible
# single-test floor that dominated `pr-eval.yml`'s wall-clock when run on every
# PR. pr-eval.yml's pytest matrix now runs `-m "not slow"` (~2.5min/shard);
# this workflow runs `-m slow` on three cadences instead:
#
#   - schedule: nightly on the default branch (regression coverage on main).
#   - workflow_dispatch: manual on-demand run against any ref.
#   - pull_request (labeled): attach `run-slow-tests` to a PR to exercise the
#     real-model suite before merge (advisory, NOT a required gate).
#
# Coverage uploads under the `slow` Codecov flag so the nightly main run keeps
# the m3 / full-corpus paths represented; Codecov merges with pr-eval.yml's
# per-shard flags server-side.

on:
  schedule:
    # 18:00 UTC ≈ 03:00 KST — off-peak nightly run on the default branch.
    - cron: "0 18 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  # One slow run at a time per ref; a new trigger cancels an in-flight run.
  group: slow-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EMBEDDING_BACKEND: hashing
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  slow-tests:
    name: Pytest (slow / real-model suite)
    # Run unconditionally on schedule / manual dispatch. On a PR, gate on the
    # `run-slow-tests` label (the workflow fires on every labeled event, so
    # filter here), same-repo head (fork PRs lack the real-model deps cache /
    # secrets and would silently skip), and an open PR.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-slow-tests' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    env:
      # `scripts/test.sh` honors PYTEST_ADDOPTS; `-m slow` selects only the
      # heavy suite. No BIDMATE_PYTEST_SPLITS — run the whole slice, unsharded.
      PYTEST_ADDOPTS: "-m 'slow'"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # PR head on a labeled run; the triggering ref (default branch on
          # schedule, the dispatched ref on workflow_dispatch) otherwise.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest (slow marker)
        run: bash scripts/test.sh

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ] && command -v coverage >/dev/null 2>&1; then
            {
              echo "## Coverage (slow)";
              echo '```';
              coverage report --skip-empty || true;
              echo '```';
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          flags: slow
          fail_ci_if_error: false
          verbose: false
