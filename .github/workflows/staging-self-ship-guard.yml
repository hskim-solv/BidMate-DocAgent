# ADR 0088 (P1): the authoritative external enforcement for the staging self-ship
# lane. This workflow is the REQUIRED STATUS CHECK that GitHub branch protection on
# `autopilot/integration` enforces — it lives outside the loop's permission domain,
# so a workspace-write runner cannot disable it (that is the whole point: the
# in-process guards in scripts/_staging_ship.py are best-effort; THIS is authority).
#
# It fails the PR (blocking the merge) when:
#   1. the PR body carries raw private RFP content (ADR 0005 data boundary), or
#   2. the PR changes a constitutional-invariant guard file without a CODEOWNERS
#      code-owner (≠ PR author) APPROVING review — the trusted signal the
#      autonomous loop physically cannot self-produce (GitHub blocks
#      self-approval). This replaces the old author-writable PR-body ack marker
#      (ADR 0091 supersedes that part of ADR 0088). It is what makes the gate-3
#      adversarial test "guard-file-change PR -> required check fail" real.
name: staging-self-ship-guard

on:
  pull_request:
    branches:
      - "autopilot/**"

permissions:
  contents: read
  # check_constitutional_review.py fetches PR files/author/reviews via `gh api`
  # using the workflow's GITHUB_TOKEN (ADR 0091).
  pull-requests: read

jobs:
  constitutional-invariant-guard:
    # The status-check CONTEXT that branch protection matches is this job's `name`.
    # Pin it equal to the workflow name so docs/ADR/runbook + `gh api` all reference
    # one identifier: `staging-self-ship-guard`.
    name: staging-self-ship-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Data-boundary scan of PR body (ADR 0005)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          from _ship_payload_guard import assert_no_raw_payload, RawPayloadViolation
          body = os.environ.get("PR_BODY", "") or ""
          try:
              assert_no_raw_payload(body)
          except RawPayloadViolation as exc:
              print(f"::error::PR body violates data boundary (ADR 0005): {exc}")
              sys.exit(1)
          print("PR body data-boundary scan: clean")
          PY
      - name: Constitutional-invariant file-change guard (ADR 0091 / CODEOWNERS)
        # If this PR touches any constitutional ship-lane file (PROTECTED_PATHS
        # in scripts/check_constitutional_review.py — now including
        # scripts/_ship_env.py, scripts/_governance.py, and .github/CODEOWNERS
        # itself), it must carry an APPROVED review from a CODEOWNERS code owner
        # who is NOT the PR author. The script fetches files/author/reviews via
        # `gh api` using the workflow's GITHUB_TOKEN. GitHub blocks self-approval,
        # so the autonomous loop (= the PR author) cannot produce this signal —
        # the old author-writable PR-body ack marker is superseded (ADR 0091
        # supersedes that part of ADR 0088).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_constitutional_review.py \
            --pr ${{ github.event.pull_request.number }}
