schema_version: 1
name: benchmark_naive_rag_v1
benchmark_type: naive_rag_benchmark
benchmark_version: v1
not_ci_smoke: true
description: Public synthetic benchmark for exposing Naive RAG retrieval and answer-grounding failures before optimization work.

corpus_dir: data/eval/benchmark/corpus
corpus_path: data/eval/benchmark/corpus_chunks_v1.jsonl
index_dir: data/eval/benchmark/index_v1
questions_path: data/eval/benchmark/rag_questions_v1.jsonl
gold_evidence_path: data/eval/benchmark/gold_evidence_v1.jsonl
output_root: experiments/runs

dataset_metadata:
  dataset_id: synthetic_naive_rag_benchmark_v1
  privacy: public_synthetic
  intended_use: public reproducibility, ablation setup, and failure-mode discovery
  not_for_claims: final real-world RAG performance claims require private real-eval
  minimum_questions: 50
  minimum_answerable: 35
  minimum_unanswerable: 15
  minimum_chunk_to_top_k_ratio: 3.0
  saturation_warning_chunk_to_top_k_ratio: 5.0

index_build:
  input_path: data/eval/benchmark/corpus_chunks_v1.jsonl
  output_dir: data/eval/benchmark/index_v1
  embedding_backend: hashing
  input_kind: corpus_chunks_jsonl
  command: python3 -m eval.naive_rag.build_benchmark_index --corpus data/eval/benchmark/corpus_chunks_v1.jsonl --output data/eval/benchmark/index_v1

validator:
  command: python3 eval/naive_rag/validate_benchmark_dataset.py --config configs/eval/benchmark_naive_rag_v1.yaml
  leakage_report: reports/benchmark/naive_rag_v1_validation.json

pipeline:
  name: naive_baseline
  top_k: 10
  retrieval_mode: flat
  retrieval_backend: dense
  metadata_first: false
  rerank: false
  verifier_retry: false
  query_expansion: identity
  prompt_profile: minimal_grounded_extractive
  bm25_tokenizer: regex
  bm25_backend: okapi

metrics:
  retrieval:
    - recall_at_5
    - recall_at_10
    - mrr_at_5
    - ndcg_at_5
  citation_page:
    - citation_chunk_accuracy
    - citation_page_coverage
    - citation_page_precision
    - missing_page_number_rate
    - page_metadata_coverage
  answer:
    - rule_based_groundedness
    - term_coverage_accuracy
    - failed_abstention_rate
    - unsafe_answer_rate
    - rule_based_hallucination_rate
  latency:
    - warm_query_latency_ms
    - retrieval_latency_ms
    - generation_latency_ms

metric_display_names:
  retrieval:
    recall_at_5: explicit-gold-evidence Recall@5
    recall_at_10: explicit-gold-evidence Recall@10
    mrr_at_5: explicit-gold-evidence MRR@5
    ndcg_at_5: explicit-gold-evidence nDCG@5
  citation_page:
    citation_chunk_accuracy: rule-based gold citation chunk accuracy
    citation_page_coverage: rule-based gold page coverage
    citation_page_precision: rule-based cited page precision
    missing_page_number_rate: page metadata missing rate
    page_metadata_coverage: corpus chunk page metadata coverage
  answer:
    rule_based_groundedness: provisional citation-in-retrieved-context check
    term_coverage_accuracy: provisional expected-term lexical coverage check
    failed_abstention_rate: rule-based unanswerable failure rate
    unsafe_answer_rate: rule-based unsafe answer rate
    rule_based_hallucination_rate: rule-based answerable wrong-citation hallucination rate
  latency:
    warm_query_latency_ms: warm query latency excluding setup costs
    retrieval_latency_ms: retrieval stage latency when available
    generation_latency_ms: external generation latency only if measured
