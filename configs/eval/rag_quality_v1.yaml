schema_version: 1
name: rag_quality_v1
evaluation_type: public_fixture_smoke_regression
not_a_benchmark: true
description: >
  Naive RAG public fixture smoke/regression contract. This config is useful
  for deterministic CI stability only and must not be used for RAG performance
  claims.

index_dir: data/index
questions_path: data/eval/rag_questions.jsonl
gold_evidence_path: data/eval/gold_evidence.jsonl
output_root: experiments/runs

pipeline:
  name: naive_baseline
  top_k: 10
  retrieval_mode: flat
  retrieval_backend: dense
  metadata_first: false
  rerank: false
  verifier_retry: false
  query_expansion: identity
  prompt_profile: minimal_grounded_extractive
  bm25_tokenizer: regex
  bm25_backend: okapi

metrics:
  retrieval:
    - recall_at_5
    - recall_at_10
    - mrr_at_5
    - ndcg_at_5
  answer:
    - rule_based_groundedness
    - term_coverage_accuracy
    - citation_chunk_accuracy
    - generator_hallucination_flag
    - failed_abstention_flag
    - unsupported_answer_flag
    - unanswerable_detection_flag
